name: Update formula

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: formula-update
  cancel-in-progress: false

jobs:
  update:
    name: Check promoted release
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out tap
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Update formula from promoted release
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tag="$(ruby scripts/update-formula.rb)"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- Formula/mutte.rb; then
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
            printf 'Formula already follows %s.\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Validate generated formula
        if: steps.update.outputs.changed == 'true'
        run: |
          ruby -c Formula/mutte.rb
          git diff --check
      - name: Open protected update pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.update.outputs.tag }}
        run: |
          title="Update Mutte formula to $TAG"
          existing_url="$(gh pr list --state open --search "$title in:title" --json url --jq '.[0].url // ""')"
          if [ -n "$existing_url" ]; then
            printf 'Existing update pull request: %s\n' "$existing_url" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          branch="automation/mutte-${TAG#v}-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git add Formula/mutte.rb
          git commit --message "$title"
          git push origin "HEAD:refs/heads/$branch"
          pull_request_url="$(gh pr create \
            --base main \
            --head "$branch" \
            --title "$title" \
            --body "Update the Homebrew formula to the reviewed client channel \`$TAG\`. Archive URLs and SHA-256 digests come from the published GitHub release; required native install checks remain the merge gate.")"
          gh workflow run ci.yml --ref "$branch"
          printf 'Opened %s and dispatched Formula CI.\n' "$pull_request_url" >> "$GITHUB_STEP_SUMMARY"
